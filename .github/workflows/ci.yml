name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: catch node or protocol changes with the live tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: unit tests (recorded mainnet fixtures, no network)
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -t . -v
      - name: install and smoke test the CLI
        run: |
          python -m pip install .
          n3-lineage --version
          n3-lineage history 0xf970f4ccecd765b63732b821775dc38c25d74f23 --until 14829383 -q \
            --replay tests/fixtures/router-history.json > history.txt
          grep -q "11 update(s) since deploy at block 596,838" history.txt

  live:
    name: live tests (public mainnet RPC)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true  # public nodes can be down; that is not a code failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: N3_LIVE=1 PYTHONPATH=src:tests python -m unittest tests.test_live -v
